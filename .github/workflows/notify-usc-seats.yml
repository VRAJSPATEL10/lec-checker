name: Notify USC seats

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: notify-usc-seats
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check for USC seat openings and notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
        run: node check-usc-seats.mjs

      - name: Commit updated USC state
        run: |
          git config user.name "lec-checker-bot"
          git config user.email "lec-checker-bot@users.noreply.github.com"
          git add -f usc-state.json
          if git diff --cached --quiet; then
            echo "No state changes"
            exit 0
          fi
          git commit -m "chore: update usc seat state"
          git pull --rebase --autostash origin main || true
          git push
