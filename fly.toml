# Fly.io config for the USC seat notifier.
#
# This is a background worker — no HTTP listener, no proxy routing. One VM
# in lax, running forever, polling every 60s. Removing the [http_service]
# block prevents Fly's edge proxy from trying to route port 8080 to us and
# stops it from spawning multiple machines for HA.
#
# Deploy / redeploy:
#   flyctl deploy
#
# Scale to a single machine (needed once after first deploy):
#   flyctl scale count 1
#
# Watch logs:
#   flyctl logs
#
# Set / rotate the ntfy topic:
#   flyctl secrets set NTFY_TOPIC=lec-checker-b10115ed7680

app = 'lec-checker'
primary_region = 'lax'

[build]

[env]
  POLL_INTERVAL_SEC = '60'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
