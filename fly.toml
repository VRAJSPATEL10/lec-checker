# Fly.io config for the USC seat notifier.
# One long-running worker VM, no HTTP service, no volumes. Poll every 60s.
#
# Deploy:
#   flyctl auth login
#   flyctl launch --no-deploy --copy-config     # first time only, creates the app
#   flyctl secrets set NTFY_TOPIC=lec-checker-b10115ed7680
#   flyctl deploy
#
# Update after config or code changes:
#   flyctl deploy
#
# Watch logs:
#   flyctl logs
#
# NOTE: fill in `app` below with the exact name Fly assigned (or one you pick).

app = "lec-checker"
primary_region = "lax"  # Los Angeles — close to classes.usc.edu (~5ms)

[build]

[env]
  POLL_INTERVAL_SEC = "60"

# No [http_service] on purpose — this is a background worker, not a web app.
# Fly will keep the VM running indefinitely without health checks.

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
